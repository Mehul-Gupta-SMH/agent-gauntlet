name: live-gauntlet

# Manual only, deliberately. A live gauntlet spends real money on every run,
# and variants x scenarios x repeats x seeds x 2 conditions is multiplicative
# -- firing this on push would be a cost incident waiting to happen. The
# offline suite (ci.yml) is what guards every commit.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "CommonADK SDK target"
        type: choice
        default: langgraph
        options: [langgraph, claude, openai, crewai, autogen, google-adk]
      repeats:
        description: "k per (variant, scenario)"
        default: "2"
      seeds:
        description: "independent seeds (pre-registered minimum is 3)"
        default: "3"
      fixture:
        description: "Task fixture. audited.yaml is the hardened one"
        type: choice
        default: fixtures/inventory/audited.yaml
        options:
          # Partial audit coverage. The cross-check verifies a subset, so it
          # is not the answer and a variant still has work to do.
          - fixtures/inventory/audited.yaml
          # The original. Kept runnable so experiment 003 stays reproducible;
          # its cross-check IS the answer, so the top variants tie at 1.00 and
          # the gate cannot pass however stable the system is.
          - fixtures/inventory/task.yaml
      mode:
        description: "How far to go -- escalate one step at a time"
        type: choice
        default: smoke
        options:
          - smoke    # one raw API call; proves the credential
          - probe    # one full gauntlet run; proves build->run->trace->parse
          - matrix   # the full run; the only step that costs real money
        # `probe` also runs by itself -- see live-probe.yml, which fires on
        # every code push to main and daily. Dispatching it here is for
        # probing a fixture or target that workflow does not cover.

# `contents: write` is here for exactly one step: committing the ledger of a
# paid matrix back to the repository (#46). It was `contents: read` until a
# measured cost made the case -- experiment 010 had to answer #4 by parsing
# the printed board out of `console.txt`, because the per-run records had
# expired with their artifact, and that capped the analysis at whatever the
# board happened to print. No outcome mix per variant, no per-scenario
# breakdown, no detection-latency distribution, no clean/faulted pairing at
# run granularity.
#
# A matrix costs ~$5 and half an hour. The ledger is a few hundred KB.
# Actions artifacts expire on the retention setting, so "it is in the
# artifact" is a deadline rather than a location -- and the 003 and 007
# ledgers are about to prove it by vanishing in mid-December.
#
# The narrow scope is the mitigation: the commit step touches only
# `experiments/live/<run id>/`, runs only for `mode == matrix`, and commits
# only `runs.jsonl` and `summary.json`. It never touches a fixture, a
# workflow, or anything under `src/`.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The target decides which CommonADK extra is needed. langgraph is
          # the default because it reaches Anthropic models through a pure
          # Python path (langchain-anthropic) with no extra system deps.
          pip install -e .
          pip install "commonadk[${{ inputs.target == 'google-adk' && 'google' || inputs.target }}]"

      - name: Check the credential is actually present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is empty or not set for this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Only the NAME is checked here; the value is never printed."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY present (length ${#ANTHROPIC_API_KEY})"

      - name: Smoke test — one cheap call before spending on a matrix
        if: ${{ inputs.mode == 'smoke' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import anthropic
          client = anthropic.Anthropic()
          r = client.messages.create(
              model="claude-sonnet-5",
              max_tokens=16,
              messages=[{"role": "user", "content": "Reply with the single word: ok"}],
          )
          print("stop_reason:", r.stop_reason)
          print("usage:", r.usage.input_tokens, "in /", r.usage.output_tokens, "out")
          print("text:", "".join(b.text for b in r.content if b.type == "text"))
          PY

      - name: Probe — one full run, proving the path before a matrix
        if: ${{ inputs.mode == 'probe' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          gauntlet probe "${{ inputs.fixture }}" --target "${{ inputs.target }}"

      - name: Live gauntlet
        if: ${{ inputs.mode == 'matrix' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          gauntlet run "${{ inputs.fixture }}" \
            --out runs \
            --live \
            --target "${{ inputs.target }}" \
            --repeats "${{ inputs.repeats }}" \
            --seeds "${{ inputs.seeds }}"

      - name: Upload the ledger and the winning config
        if: ${{ always() && inputs.mode == 'matrix' }}
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-run
          path: |
            runs/runs.jsonl
            runs/summary.json
            runs/winner/**
          if-no-files-found: warn

      # The artifact above expires; this does not (#46). Kept as a separate
      # step rather than folded into the upload so a failure to commit never
      # loses the artifact -- belt and braces, in that order.
      - name: Commit the ledger, because the artifact expires
        if: ${{ always() && inputs.mode == 'matrix' }}
        env:
          FIXTURE: ${{ inputs.fixture }}
          TARGET: ${{ inputs.target }}
          SEEDS: ${{ inputs.seeds }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          test -f runs/runs.jsonl || { echo "no ledger to commit"; exit 0; }

          dest="experiments/live/${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          cp runs/runs.jsonl "$dest/"
          if [ -f runs/summary.json ]; then cp runs/summary.json "$dest/"; fi

          # A ledger carries no model output text -- `answer` holds a total,
          # a bool and a confidence, nothing else. The one field whose
          # content comes from outside this repo is `error`, so it is
          # printed for a human to read rather than vouched for silently.
          # No heredoc: its terminator cannot be indented inside a YAML
          # block scalar, which is a bug that only shows up at run time.
          echo "--- error strings in this ledger, review before trusting it ---"
          python -c 'import json,sys;rows=[json.loads(l) for l in open(sys.argv[1],encoding="utf-8")];errs=[r["error"] for r in rows if r.get("error")];[print("  "+e[:200]) for e in errs];print(f"  ({len(errs)} of {len(rows)} record(s) carried an error)")' "$dest/runs.jsonl"

          {
            printf '# Live matrix %s\n\n' "$GITHUB_RUN_ID"
            printf 'Committed by `live-gauntlet.yml` because Actions artifacts expire\n'
            printf 'and this one should not (#46).\n\n'
            printf '| | |\n|---|---|\n'
            printf '| fixture | `%s` |\n' "$FIXTURE"
            printf '| target | `%s` |\n' "$TARGET"
            printf '| seeds | %s |\n' "$SEEDS"
            printf '| repeats | %s |\n' "$REPEATS"
            printf '| commit | `%s` |\n' "$GITHUB_SHA"
            printf '| run | https://github.com/%s/actions/runs/%s |\n\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'The ledger is the evidence, not the summary: it carries the\n'
            printf 'per-run outcome, the schedule that produced it, the resolved\n'
            printf 'model, the variant fingerprint, the pricing authority and the\n'
            printf 'scenario provenance. Re-grade it under rules written after the\n'
            printf 'fact rather than paying for another matrix.\n'
          } > "$dest/README.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "live matrix ${GITHUB_RUN_ID}: the ledger, before the artifact expires (#46)"

          # Rebase rather than force: a human may well have pushed during a
          # 45-minute matrix, and this commit is purely additive.
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME"; then break; fi
            sleep $((i * 5))
          done
          git push origin "HEAD:$GITHUB_REF_NAME"
