name: ci

# The offline suite guards every commit. It needs no credentials and spends
# nothing, which is the whole point of the scripted-policy path.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: The offline suite
        # The failing test names are echoed as `::error::` lines, which
        # become CHECK-RUN ANNOTATIONS -- and annotations are served by
        # api.github.com, unlike the job log, which lives on an artifact
        # host some environments cannot reach. This suite went red on three
        # consecutive commits and the names of the failing tests existed in
        # exactly one unreachable place; reproducing a fresh install
        # locally passed, so there was nothing to go on. A build that says
        # what broke is worth more than one that only says it broke.
        run: |
          set +e
          set -u
          pytest -q --tb=short > pytest.out 2>&1
          status=$?
          tail -c 20000 pytest.out
          if [ "$status" -ne 0 ]; then
            # The summary lines first: those name the tests.
            grep -E '^(FAILED|ERROR) ' pytest.out | while IFS= read -r line; do
              echo "::error::$line"
            done
            # And the count, so a run that died before any summary still
            # says something readable rather than nothing.
            echo "::error::pytest exited $status on Python ${{ matrix.python-version }} -- $(grep -cE '^(FAILED|ERROR) ' pytest.out) named failure(s)"
            exit "$status"
          fi
      - name: End-to-end offline run
        # Every fixture: the original keeps experiment 003 reproducible, the
        # audited one is what the gate runs against, and the rest each
        # exercise a different fault kind end to end.
        #
        # Exit 3 means the pre-registered gate returned FAIL, which is a
        # MEASUREMENT, not a build failure. Offline the variants are scripted
        # policies whose slip rates are arbitrary -- a gate verdict over them
        # says nothing about agents (see experiments/001), and letting it turn
        # the repo red permanently would make CI's signal worthless. What this
        # step guards is that the path runs end to end: any other non-zero is
        # a crash and fails the build.
        run: |
          # +e deliberately: Actions runs this with -e, so a gate FAIL would
          # kill the step before the exit code could be inspected at all.
          set +e
          set -u
          # Every fault kind, because each one takes a different route
          # through the interposer and the scorer -- a crash in the
          # instruction or memory path would otherwise only show up when
          # somebody ran that fixture by hand.
          for fixture in inventory/task inventory/audited lending/applicant \
                         poisoning/instruction poisoning/memory; do
            name="${fixture//\//-}"
            gauntlet run "fixtures/$fixture.yaml" \
              --out "/tmp/ci-$name" --repeats 2 --seeds 2
            status=$?
            case "$status" in
              0) echo "::notice::$fixture -- gate PASS" ;;
              3) echo "::notice::$fixture -- gate FAIL (expected offline; the path ran)" ;;
              *) echo "::error::$fixture -- gauntlet exited $status, which is a crash"
                 exit "$status" ;;
            esac
          done
      - name: The example must keep running
        run: python examples/offline_gate.py
