name: ci

# The offline suite guards every commit. It needs no credentials and spends
# nothing, which is the whole point of the scripted-policy path.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q
      - name: End-to-end offline run
        run: gauntlet run fixtures/inventory/task.yaml --out /tmp/ci --repeats 2 --seeds 2
