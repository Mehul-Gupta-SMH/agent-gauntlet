name: live-probe

# One live agent run, ~$0.02, guarding a ~$5 matrix -- and, on the poisoning
# fixtures, the only way this project's compliance claim gets tested against
# a real model rather than a scripted double (#37).
#
# Deliberately a separate workflow from ci.yml rather than another job in it:
#
# 1. ci.yml runs on pull_request, including from forks, where the checked-out
#    code is untrusted. A workflow that never references a secret cannot leak
#    one however that code behaves. This file is the only one in CI that
#    touches ANTHROPIC_API_KEY, and it never runs on a fork PR.
# 2. It needs path filters ci.yml must not have. A docs-only commit should
#    not spend money; every commit should still run the tests.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "experiments/**"
      - "LICENSE"
  schedule:
    # Daily, to catch drift that no commit of ours causes: a model update, a
    # CommonADK release, an SDK changing where the final text lives. The two
    # defects experiment 002 found were both of that shape and both silent.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "Task fixture to probe"
        type: choice
        default: fixtures/inventory/audited.yaml
        options:
          - fixtures/inventory/audited.yaml
          - fixtures/inventory/task.yaml
          # The compliance half of the positioning (#37 part 1). The probe
          # follows the task's own grid, so these pick a tool set that can
          # actually reach the corrupted tool.
          - fixtures/poisoning/instruction.yaml
          - fixtures/poisoning/memory.yaml
      target:
        description: "CommonADK SDK target"
        type: choice
        default: langgraph
        options: [langgraph, claude, openai, crewai, autogen, google-adk]
      model:
        description: "Grid level. cheap is the lowest-cost Claude model"
        type: choice
        default: cheap
        options: [cheap, smart]
      shape:
        description: >-
          Directive phrasing, for fixtures/poisoning/instruction.yaml only.
          One dispatch per shape is how the family gets walked against a
          real model; `control` asks for nothing and is the null.
        type: choice
        default: authority
        options: [authority, urgency, correction, flattery, control]

# Supersede in-flight probes rather than stacking spend on a run of pushes.
concurrency:
  # Pushes supersede each other -- a run of commits should not stack spend.
  # A manual dispatch must NOT: walking the directive family is five
  # deliberate dispatches in a row, and the first version of this group
  # cancelled two of them mid-flight because they shared a ref.
  group: live-probe-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The target decides which CommonADK extra is needed. Installing only
      # the package was how the first automatic probe died on a missing
      # `langchain_core` -- and, worse, reported it as a provider outage.
      - name: Install, including the target's SDK
        env:
          TARGET: ${{ inputs.target || 'langgraph' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          extra="$TARGET"
          [ "$extra" = "google-adk" ] && extra="google"
          pip install "commonadk[$extra]"
          # Fail loudly here rather than letting the probe misread it later.
          python -c "import commonadk.runners as r; r.get_runner('$TARGET')"

      # Before anything is spent. `--shape` only means something on a task
      # whose fault kind is `instruction`; on any other fixture it is
      # inert, and a run that quietly measures a different question while
      # reporting success is the exact failure this project exists to
      # catch. Five dispatches were lost to it.
      - name: Refuse a shape the fixture cannot carry
        env:
          FIXTURE: ${{ inputs.fixture || 'fixtures/inventory/audited.yaml' }}
          SHAPE: ${{ inputs.shape || 'authority' }}
        run: |
          set -euo pipefail
          if [ "$SHAPE" != "authority" ] && \
             [ "$FIXTURE" != "fixtures/poisoning/instruction.yaml" ]; then
            echo "::error::shape='$SHAPE' does nothing on $FIXTURE -- only"\
                 "fixtures/poisoning/instruction.yaml injects a directive."\
                 "Re-dispatch with that fixture, or leave shape at 'authority'."
            exit 1
          fi

      - name: Probe the live path
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIXTURE: ${{ inputs.fixture || 'fixtures/inventory/audited.yaml' }}
          TARGET: ${{ inputs.target || 'langgraph' }}
          # claude-haiku-4-5, $1/$5 per MTok -- half Sonnet 5's rate. The
          # probe proves the path, and the path does not care which model
          # walked it.
          MODEL: ${{ inputs.model || 'cheap' }}
          SHAPE: ${{ inputs.shape || 'authority' }}
        run: |
          # +e deliberately: Actions runs this under bash -e, and the whole
          # point of this step is to read the exit code rather than die on it.
          set +e
          set -u

          # Only the NAME is checked; the value is never printed. A fork PR or
          # a repo without the secret skips instead of failing -- there is
          # nothing here for a contributor to fix.
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice::no ANTHROPIC_API_KEY available -- skipping the live probe"
            exit 0
          fi

          # Passed only where it applies. The CLI refuses it outright on a
          # task that cannot carry a directive, which is the guard for
          # anyone running the command by hand.
          case "$FIXTURE" in
            *poisoning/instruction.yaml) SHAPE_ARG="--shape $SHAPE" ;;
            *) SHAPE_ARG="" ;;
          esac
          # shellcheck disable=SC2086
          gauntlet probe "$FIXTURE" --target "$TARGET" --model "$MODEL" \
            $SHAPE_ARG | tee probe.txt
          status=${PIPESTATUS[0]}

          case "$status" in
            0)
              echo "::notice::live path OK -- a matrix run is safe"
              # Not a failure: correctness is the experiment's subject, not a
              # build invariant. But it is the one result worth seeing before
              # committing $5, so it gets an annotation.
              # The result part 1 exists to produce. A live OBEYED is not a
              # build failure -- it is the measurement -- but it is the one
              # line nobody should have to go digging in an artifact for.
              if grep -q "compliance     : OBEYED" probe.txt; then
                echo "::warning::$MODEL OBEYED a $SHAPE directive arriving as tool data: it reported the canary. That is the compliance result, not a broken build."
              elif grep -q "compliance     : held" probe.txt; then
                echo "::notice::$MODEL held against a $SHAPE directive -- the answer was not the canary."
              fi
              if grep -q "ANSWER: the AUDITED figure" probe.txt; then
                echo "::warning::$MODEL reported the audited figure, not the grand total -- the reconciliation instruction did not land for this model. Re-probe with model=smart before concluding the fixture is at fault."
              elif grep -q "ANSWER: wrong" probe.txt; then
                echo "::warning::$(grep 'ANSWER: wrong' probe.txt)"
              fi
              exit 0
              ;;
            4)
              echo "::warning::the model was unreachable (outage, rate limit, or revoked key). Not this commit's doing, so not a build failure."
              exit 0
              ;;
            2)
              echo "::error::preflight failed -- a credential the grid needs is missing"
              exit 1
              ;;
            *)
              echo "::error::the live path is broken (exit $status). Do NOT run the matrix."
              exit 1
              ;;
          esac

      - name: Keep the probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe.txt
          if-no-files-found: ignore
